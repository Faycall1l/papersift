[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papersift"
version = "0.1.0"
description = "Find and screen papers for systematic reviews, PRISMA style."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest"]

[project.scripts]
papersift = "papersift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papersift"]
