<text class="t" x="600" y="198" font-size="18" font-weight="700" text-anchor="middle">Screen</text><text class="m" x="600" y="219" font-size="13" text-anchor="middle">title and abstract</text>
<circle class="ring" cx="840" cy="130" r="34"/>
