<text class="t" x="120" y="198" font-size="18" font-weight="700" text-anchor="middle">Sources</text><text class="m" x="120" y="219" font-size="13" text-anchor="middle">5 databases, RIS, Zotero</text>
<circle class="ring" cx="360" cy="130" r="34"/>
