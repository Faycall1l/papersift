<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<style>
.d{opacity:0}
.ok{animation:ok 10s linear infinite}
.s1{animation:s1 10s linear infinite}
.s2{animation:s2 10s linear infinite}
@keyframes ok{0%{transform:translateX(0);opacity:0;fill:#4f6272}4%{opacity:1}44%{fill:#4f6272}50%{fill:#8a5a2b}72%{fill:#8a5a2b}78%{fill:#2e7d32}94%{opacity:1;fill:#2e7d32}100%{transform:translateX(920px);opacity:0;fill:#2e7d32}}
@keyframes s1{0%{transform:translate(0,0);opacity:0}4%{opacity:1}46%{transform:translate(460px,0);opacity:1}58%{transform:translate(460px,70px);opacity:0}100%{transform:translate(460px,70px);opacity:0}}
@keyframes s2{0%{transform:translate(0,0);opacity:0}4%{opacity:1}72%{transform:translate(690px,0);opacity:1}84%{transform:translate(690px,70px);opacity:0}100%{transform:translate(690px,70px);opacity:0}}
.pulse{animation:p 10s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.d,.pulse{animation:none;opacity:1}}
</style>
