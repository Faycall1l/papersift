<style>
.t{fill:#24292f}.m{fill:#6a737d}.ring{fill:#fff;stroke:#c9bba3;stroke-width:2}.done{fill:#eaf5ec;stroke:#2e7d32}.trk{stroke:#d8dee4}.ic{color:#8a5a2b}.okc{color:#2e7d32}.rj{color:#b42318}.ai{color:#d4a017}
@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#9da7b3}.ring{fill:#161b22;stroke:#4d5b69}.done{fill:#12261a}.trk{stroke:#30363d}.ic{color:#d9a066}}
.d{opacity:0;transform-box:fill-box;transform-origin:center}
.ok{animation:ok 10s linear infinite}.dup{animation:dup 10s linear infinite}.s1{animation:s1 10s linear infinite}.s2{animation:s2 10s linear infinite}
@keyframes ok{0%{transform:translateX(0);opacity:0;color:#4f6272}4%{opacity:1}70%{color:#4f6272}84%{color:#2e7d32}90%{transform:translateX(940px) scale(1);opacity:1}96%{transform:translateX(960px) scale(.2);opacity:0;color:#2e7d32}100%{opacity:0}}
@keyframes dup{0%{transform:translate(0,0);opacity:0}4%{opacity:1}24%{transform:translate(240px,0);opacity:1}34%{transform:translate(262px,-48px) rotate(14deg);opacity:0}100%{opacity:0}}
@keyframes s1{0%{transform:translate(0,0);opacity:0}4%{opacity:1;color:#4f6272}44%{transform:translate(480px,0);opacity:1}56%{transform:translate(510px,62px) rotate(-18deg);opacity:0;color:#b42318}100%{opacity:0}}
@keyframes s2{0%{transform:translate(0,0);opacity:0}4%{opacity:1;color:#4f6272}64%{transform:translate(720px,0);opacity:1}76%{transform:translate(752px,62px) rotate(16deg);opacity:0;color:#b42318}100%{opacity:0}}
.pulse{animation:p 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.glow{animation:g 10s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes g{0%,86%{opacity:0;transform:scale(1)}92%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.d,.pulse,.glow{animation:none}.d{opacity:1}}
</style>
<line class="trk" x1="120" y1="130" x2="1080" y2="130" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
<circle class="ring" cx="120" cy="130" r="34"/>
