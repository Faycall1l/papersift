<circle class="glow" cx="1080" cy="130" r="34" fill="none" stroke="#2e7d32" stroke-width="3"/>
<circle class="ring done" cx="1080" cy="130" r="34"/>
<use href="#i-check" class="okc" x="1065" y="115" width="30" height="30"/>
